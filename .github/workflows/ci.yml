name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR/branch cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:cov

      # NEXT_PUBLIC_* é incorporada ao bundle, então o build exige o valor.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001

  e2e:
    name: Testes e2e
    runs-on: ubuntu-latest
    # Inclui instalar o navegador e percorrer a suíte completa, inclusive em runner frio.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Obter a versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restaurar navegadores do cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Instalar navegador
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # O cache guarda só os navegadores; as bibliotecas do sistema não.
      - name: Instalar dependências do navegador
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes e2e
        run: npm run test:e2e

      - name: Publicar relatório e traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
